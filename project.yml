name: NotreArbre
options:
  bundleIdPrefix: com.fayadhu
  deploymentTarget:
    iOS: "26.0"
packages:
  ArbreCore:
    path: ArbreCore
targets:
  NotreArbre:
    type: application
    platform: iOS
    sources: [NotreArbre]
    dependencies:
      - package: ArbreCore
    info:
      path: NotreArbre/Info.plist
      properties:
        CFBundleDisplayName: Notre arbre
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Le micro sert à répondre aux questions de l'entretien."
        NSSpeechRecognitionUsageDescription: "La reconnaissance vocale transforme tes réponses en texte, sur ton iPhone."
        NSCameraUsageDescription: "L'appareil photo sert à lire un livret de famille ou un acte."
        NSPhotoLibraryUsageDescription: "Pour choisir la photo d'un document."
        LSApplicationQueriesSchemes: [whatsapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fayadhu.notrearbre
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  NotreArbre:
    build:
      targets:
        NotreArbre: all
